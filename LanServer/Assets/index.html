<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LanC — File Server</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #f5f7fa;
    --bg-card:     #ffffff;
    --bg-card2:    #f8fafd;
    --border:      #e2e8f0;
    --blue:        #2563eb;
    --blue-dim:    #1d4ed8;
    --blue-soft:   #eff6ff;
    --green:       #059669;
    --green-soft:  #ecfdf5;
    --text:        #0f172a;
    --text-sec:    #475569;
    --text-muted:  #94a3b8;
    --shadow:      0 1px 4px rgba(0,0,0,0.06);
    --shadow-md:   0 4px 16px rgba(0,0,0,0.08);
    --radius:      10px;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ─────────────────────────────────────────────────────────── */
  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    position: sticky; top: 0; z-index: 10;
    box-shadow: var(--shadow);
  }
  .logo-accent { width: 4px; height: 26px; background: var(--blue); border-radius: 2px; margin-right: 12px; }
  .logo-mark   { font-size: 1.2rem; font-weight: 800; color: var(--text); }
  .logo-sep    { width: 1px; height: 20px; background: var(--border); margin: 0 14px; }
  .logo-sub    { font-size: 0.82rem; color: var(--text-sec); font-weight: 500; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  .status-pill {
    display: flex; align-items: center; gap: 7px;
    background: var(--green-soft);
    border: 1px solid rgba(5,150,105,0.25);
    border-radius: 20px; padding: 5px 14px;
    font-size: 0.78rem; font-weight: 700; color: var(--green);
  }
  .status-dot {
    width: 7px; height: 7px; background: var(--green); border-radius: 50%;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(5,150,105,0.4); }
    50%  { box-shadow: 0 0 0 6px rgba(5,150,105,0); }
    100% { box-shadow: 0 0 0 0 rgba(5,150,105,0); }
  }

  .file-count-badge {
    font-size: 0.78rem; color: var(--text-sec); background: var(--bg-card2);
    border: 1px solid var(--border); border-radius: 12px; padding: 4px 12px; font-weight: 600;
  }
  .refresh-indicator {
    font-size: 0.72rem; color: var(--text-muted);
    display: flex; align-items: center; gap: 5px;
  }
  .refresh-dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted);
    transition: background 0.3s;
  }
  .refresh-dot.active { background: var(--blue); }

  /* ── Main ────────────────────────────────────────────────────────────── */
  main { flex: 1; max-width: 980px; width: 100%; margin: 0 auto; padding: 32px 24px 52px; }

  .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .section-title  { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
  .section-line   { flex: 1; height: 1px; background: var(--border); }

  /* ── Card ────────────────────────────────────────────────────────────── */
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    animation: slideIn 0.3s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Table ───────────────────────────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--bg-card2); color: var(--text-muted);
    font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 10px 20px; text-align: left; border-bottom: 1px solid var(--border);
  }
  thead th:last-child { text-align: right; width: 120px; }
  thead th:nth-child(2) { width: 90px; }

  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.13s; animation: rowIn 0.25s ease both; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--blue-soft); }

  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  tbody tr:nth-child(1)  { animation-delay: 0.02s; }
  tbody tr:nth-child(2)  { animation-delay: 0.05s; }
  tbody tr:nth-child(3)  { animation-delay: 0.08s; }
  tbody tr:nth-child(4)  { animation-delay: 0.11s; }
  tbody tr:nth-child(5)  { animation-delay: 0.14s; }
  tbody tr:nth-child(6)  { animation-delay: 0.17s; }
  tbody tr:nth-child(7)  { animation-delay: 0.20s; }
  tbody tr:nth-child(8)  { animation-delay: 0.23s; }

  tbody td { padding: 13px 20px; vertical-align: middle; }
  tbody td:last-child { text-align: right; }

  .file-cell { display: flex; align-items: center; gap: 12px; }
  .file-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 40px; height: 36px; padding: 0 6px;
    background: var(--blue-soft); border: 1px solid rgba(37,99,235,0.18);
    border-radius: 7px; font-size: 0.6rem; font-weight: 900; color: var(--blue);
    letter-spacing: 0.03em; flex-shrink: 0; transition: transform 0.15s;
  }
  tbody tr:hover .file-badge { transform: scale(1.06); }
  .file-name { font-weight: 600; color: var(--text); word-break: break-all; }
  .file-meta { font-size: 0.76rem; color: var(--text-muted); margin-top: 1px; }
  .file-size { font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; }

  .dl-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--blue); color: #fff; text-decoration: none;
    padding: 6px 16px; border-radius: 7px; font-size: 0.78rem; font-weight: 700;
    transition: background 0.14s, transform 0.12s, box-shadow 0.14s;
    box-shadow: 0 1px 4px rgba(37,99,235,0.2); white-space: nowrap;
  }
  .dl-btn:hover  { background: var(--blue-dim); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
  .dl-btn:active { transform: translateY(0); }

  /* ── Empty ───────────────────────────────────────────────────────────── */
  .empty { padding: 72px 24px; text-align: center; }
  .empty-icon { font-size: 3rem; opacity: 0.25; display: block; margin-bottom: 16px; }
  .empty-text { font-size: 1rem; font-weight: 600; color: var(--text-sec); }
  .empty-sub  { font-size: 0.82rem; color: var(--text-muted); margin-top: 6px; }

  /* ── Footer ──────────────────────────────────────────────────────────── */
  footer {
    border-top: 1px solid var(--border); padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.75rem; color: var(--text-muted); background: var(--bg-card);
  }
  footer strong { color: var(--text-sec); }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center">
    <div class="logo-accent"></div>
    <span class="logo-mark">LanC</span>
    <div class="logo-sep"></div>
    <span class="logo-sub">File Server</span>
  </div>
  <div class="header-right">
    <div class="refresh-indicator">
      <div class="refresh-dot" id="rdot"></div>
      <span id="rlbl">live</span>
    </div>
    <span class="file-count-badge" id="fileCount">{{FILE_COUNT}} file(s)</span>
    <div class="status-pill"><div class="status-dot"></div>Online</div>
  </div>
</header>

<main>
  <div class="section-header">
    <span class="section-title">Available Files</span>
    <div class="section-line"></div>
  </div>
  <div class="card" id="fileCard">
    <div id="tableContainer">{{FILE_TABLE}}</div>
  </div>
</main>

<footer>
  <span><strong>LanC</strong> &mdash; LAN Command &amp; Control</span>
  <span>Port <strong>{{HTTP_PORT}}</strong></span>
</footer>

<script>
  // Live-poll /api/files every 3 seconds and re-render table without full reload
  let lastCount = {{FILE_COUNT}};
  const rdot = document.getElementById('rdot');
  const rlbl = document.getElementById('rlbl');
  const fileCount = document.getElementById('fileCount');
  const tableContainer = document.getElementById('tableContainer');

  function renderTable(files) {
    if (files.length === 0) {
      return `<div class="empty">
        <span class="empty-icon">▤</span>
        <div class="empty-text">No files uploaded yet.</div>
        <div class="empty-sub">Upload files from the LanC Server Control Panel.</div>
      </div>`;
    }
    let html = '<table><thead><tr><th>File</th><th>Size</th><th></th></tr></thead><tbody>';
    files.forEach((f, i) => {
      const delay = (i * 0.03).toFixed(2);
      html += `<tr style="animation-delay:${delay}s">
        <td><div class="file-cell">
          <span class="file-badge">${esc(f.ext || 'FILE')}</span>
          <div>
            <div class="file-name">${esc(f.name)}</div>
            <div class="file-meta">${esc(f.sizeStr)}</div>
          </div>
        </div></td>
        <td class="file-size">${esc(f.sizeStr)}</td>
        <td><a class="dl-btn" href="${f.url}">&#8595;&nbsp;Download</a></td>
      </tr>`;
    });
    html += '</tbody></table>';
    return html;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function poll() {
    try {
      rdot.classList.add('active');
      const res = await fetch('/api/files');
      if (!res.ok) throw new Error('bad response');
      const files = await res.json();
      fileCount.textContent = files.length + ' file(s)';
      if (files.length !== lastCount) {
        lastCount = files.length;
        tableContainer.innerHTML = renderTable(files);
      }
      rlbl.textContent = 'live';
    } catch {
      rlbl.textContent = 'offline';
    } finally {
      setTimeout(() => rdot.classList.remove('active'), 400);
    }
  }

  // Poll every 3 s after initial render
  setInterval(poll, 3000);
</script>
</body>
</html>
